<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - CINEPLEX</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui.css">
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border: #333333;
            --red: #e50914;
            --text-main: #ffffff;
            --text-muted: #8c8c8c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; border-bottom: 1px solid var(--border);
        }
        .logo { color: var(--red); font-size: 20px; font-weight: 900; font-style: italic; }
        .timer { background: rgba(229, 9, 20, 0.1); color: var(--red); padding: 5px 15px; border-radius: 20px; font-weight: bold; }

        .checkout-container {
            display: grid; grid-template-columns: 1fr 400px; gap: 30px;
            max-width: 1200px; margin: 40px auto; padding: 0 20px;
        }

        .card { background: var(--panel-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
        .card-body { padding: 20px; }

        /* Left Column Styles */
        .movie-banner { height: 250px; background-size: cover; background-position: center; position: relative; }
        .movie-banner::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, var(--panel-bg) 0%, transparent 100%);
        }
        .movie-info-float { position: absolute; bottom: 20px; left: 20px; z-index: 2; }
        .movie-title { font-size: 24px; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
        .tags span { border: 1px solid var(--text-muted); color: var(--text-muted); padding: 3px 10px; border-radius: 20px; font-size: 11px; margin-right: 8px; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h4 { color: var(--text-muted); font-size: 12px; text-transform: uppercase; margin-bottom: 10px; font-weight: normal; }
        .seat-tag { background: var(--red); color: white; padding: 5px 12px; border-radius: 6px; display: inline-block; font-size: 14px; font-weight: bold; }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: #ccc; }
        .summary-row.total { border-top: 1px solid var(--border); padding-top: 15px; color: var(--text-main); font-size: 16px; font-weight: bold; }
        .summary-row.total span:last-child { color: var(--red); }

        .form-group { margin-bottom: 15px; }
        .form-control {
            width: 100%; background: transparent; border: 1px solid var(--border);
            padding: 12px 15px; border-radius: 8px; color: white; outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--text-muted); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .promo-box { display: flex; gap: 10px; margin: 20px 0; }
        .btn-apply { background: #333; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Card hiển thị số dư */
        .balance-box {
            background: #121212; /* Màu tối hơn nền chung để nổi bật */
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .balance-amount {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Các nút phương thức thanh toán */
        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .pay-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .pay-btn.active {
            border-color: var(--red);
            color: var(--text-main);
            background: rgba(229, 9, 20, 0.1);
        }

        /* Button xác nhận */
        .btn-submit {
            width: 100%;
            background: var(--red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .secure-text {
            text-align: center;
            color: #4a4a4a;
            font-size: 11px;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div style="grid-column: span 2; display: flex; justify-content: flex-end; margin-bottom: 20px;">
        </div>
        <div class="left-col">
            <div class="card" style="padding: 0;">
                <div class="movie-banner" id="chk-image">
                    <div class="movie-info-float">
                        <div class="tags">
                            <span id="chk-category">ACTION</span>
                            <span>IMAX 3D</span>
                        </div>
                        <h2 class="movie-title" id="chk-title">Đang tải...</h2>
                    </div>
                </div>
            </div>

            <div class="info-grid">
                <div class="card card-body">
                    <h4><i class="fa-solid fa-calendar-day"></i> Lịch chiếu</h4>
                    <p style="font-weight: bold; margin-bottom: 5px;" id="chk-date-time">Saturday, Oct 24 • 19:30</p>
                    <p style="color: var(--text-muted); font-size: 14px;">Grand Theater - Screen 01</p>
                </div>
                <div class="card card-body">
                    <h4><i class="fa-solid fa-couch"></i> Vị trí ghế</h4>
                    <div id="chk-seats-container">
                        </div>
                </div>
            </div>

            <div class="card card-body">
                <h4 style="margin-bottom: 20px;"><i class="fa-solid fa-file-invoice"></i> Tổng hoá đơn</h4>
                <div class="summary-row">
                    <span>Vé phim (<span id="chk-ticket-qty">0</span>x)</span>
                    <strong id="chk-ticket-price">0 VND</strong>
                </div>
                <div class="summary-row">
                    <span>Combo Đồ Ăn</span>
                    <strong id="chk-combo-price">0 VND</strong>
                </div>
                <div class="summary-row">
                    <span>Phí tiện ích Online</span>
                    <strong>10.000 ₫</strong>
                </div>
                <div class="summary-row total">
                    <span>TỔNG THANH TOÁN</span>
                    <strong id="chk-grand-total">0 VND</strong>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="card card-body">
                <h4 style="margin-bottom: 15px;">Số dư tài khoản</h4>
                <div class="balance-box">
                    <div class="balance-info">
                        <i class="fa-solid fa-wallet"></i> Số dư hiện tại:
                    </div>
                    <div class="balance-amount" id="user-balance">Đang tải...</div>
                </div>

                <button class="btn-submit" id="btn-confirm">XÁC NHẬN THANH TOÁN</button>
                
                <div class="secure-text">
                    <i class="fa-solid fa-lock"></i> SECURE • <i class="fa-solid fa-shield-halved"></i> ENCRYPTED • <i class="fa-solid fa-shield-halved"></i> PCI-DSS
                </div>
            </div>
        </div>
    </div>

    <script src="./script/header-footer.js"></script>
    <script>

        // 2. Lấy dữ liệu từ sessionStorage và đổ lên giao diện
        document.addEventListener('DOMContentLoaded', () => {
            const dataStr = sessionStorage.getItem('CineplexCheckout');
            
            if (!dataStr) {
                alert('Không tìm thấy thông tin giỏ hàng! Quay lại trang trước.');
                window.location.href = 'index.html'; // Hoặc product.html
                return;
            }

            const checkoutData = JSON.parse(dataStr);

            // Cập nhật thông tin Phim
            document.getElementById('chk-title').textContent = checkoutData.title;
            document.getElementById('chk-image').style.backgroundImage = `url('${checkoutData.image}')`;
            document.getElementById('chk-category').textContent = checkoutData.category;
            
            // Cập nhật Lịch chiếu
            document.getElementById('chk-date-time').textContent = `${checkoutData.date} • ${checkoutData.time}`;

            const seatsContainer = document.getElementById('chk-seats-container');
            seatsContainer.innerHTML = ''; // Xóa sạch dữ liệu mẫu ban đầu

            // Kiểm tra xem trong data gửi sang có mảng danh sách ghế cụ thể không
            if (checkoutData.seats && Array.isArray(checkoutData.seats)) {
                checkoutData.seats.forEach(seatCode => {
                    // Tạo tag hiển thị đúng mã ghế "Ghế A3:1", "Ghế B2:4"
                    seatsContainer.innerHTML += `
                        <div class="seat-tag" style="
                            background: var(--red); 
                            color: white; 
                            padding: 5px 12px; 
                            border-radius: 6px; 
                            display: inline-block; 
                            font-size: 14px; 
                            font-weight: bold; 
                            margin: 0 8px 8px 0;
                        ">Ghế ${seatCode}</div>
                    `;
                });
            } else {
                // Dự phòng trường hợp nếu không tìm thấy danh sách mảng (sử dụng logic cũ)
                const qty = parseInt(checkoutData.ticketQty) || 1;
                for(let i = 1; i <= qty; i++) {
                    seatsContainer.innerHTML += `<div class="seat-tag" style="margin: 0 8px 8px 0;">Ghế ${i}</div>`;
                }
            }

            // Cập nhật Tiền bạc
            document.getElementById('chk-ticket-qty').textContent = checkoutData.ticketQty;
            document.getElementById('chk-ticket-price').textContent = checkoutData.ticketTotal;
            document.getElementById('chk-combo-price').textContent = checkoutData.comboTotal;

            // Tính tổng tiền bao gồm 10k phí tiện ích
            // Xóa hết chữ không phải số để tính toán lại thành số nguyên
            const extractNumber = (str) => parseInt(str.replace(/[^0-9]/g, '')) || 0;
            const subTotalNum = extractNumber(checkoutData.subTotal);
            const finalTotal = subTotalNum + 10000; // Cộng thêm phí tiện ích
            
            // Format lại thành tiền tệ VN
            document.getElementById('chk-grand-total').textContent = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(finalTotal);
            // Lưu tổng tiền vào biến toàn cục để hàm thanh toán sử dụng
            window.totalPaymentAmount = finalTotal;

            // Hàm gọi API lấy số dư từ database
            window.loadUserProfileAndBalance = async function() {
                const storedUser = localStorage.getItem("currentUser");
                if (!storedUser) return;

                const user = JSON.parse(storedUser);
                
                try {
                    // BẮT BUỘC: Gọi API lấy số tiền mới nhất trong Database
                    const response = await fetch(`http://127.0.0.1:5000/api/khachhang/${user.id}`);
                    if (response.ok) {
                        const data = await response.json();
                        
                        // 1. Cập nhật số dư mới nhất lên giao diện profile.html
                        const formattedBalance = Number(data.SoDu).toLocaleString('vi-VN') + "đ";
                        const balanceElement = document.getElementById("user-balance"); // Đổi ID này theo thẻ hiển thị số dư ở trang profile của bạn
                        if (balanceElement) {
                            balanceElement.innerText = formattedBalance;
                        }

                        // 2. Tiện tay cập nhật luôn vào LocalStorage để các trang khác dùng làm dự phòng
                        user.balance = data.SoDu;
                        localStorage.setItem("currentUser", JSON.stringify(user));
                        window.currentUserBalance = data.SoDu; // Lưu vào biến toàn cục để kiểm tra bên dưới
                    }
                } catch (error) {
                    console.error("Lỗi đồng bộ số dư tại trang cá nhân:", error);
                }
            }
            window.loadUserProfileAndBalance();
            
            const confirmBtn = document.getElementById("btn-confirm");

            if (confirmBtn) {
                confirmBtn.addEventListener("click", async function (e) {
                    e.preventDefault(); // Ngăn trang bị reload mặc định

                    // 1. Lấy thông tin user hiện tại từ LocalStorage
                    const storedUser = localStorage.getItem("currentUser");
                    if (!storedUser) {
                        alert("Vui lòng đăng nhập để thực hiện thanh toán!");
                        window.location.href = "dangnhap.html";
                        return;
                    }
                    const user = JSON.parse(storedUser);

                    // 2. Lấy số tiền hóa đơn thực tế
                    const totalAmount = window.totalPaymentAmount || 0; 
                    if (totalAmount <= 0) { alert("Lỗi dữ liệu thanh toán!"); return; }

                    // 3. Kiểm tra nhanh ở Frontend trước để đỡ phải gọi API nếu không đủ tiền
                    if (window.currentUserBalance < totalAmount) {
                        alert("Số dư tài khoản không đủ để thanh toán! Vui lòng nạp thêm tiền.");
                        return;
                    }

                    // Hỏi lại người dùng một lần nữa cho chắc chắn
                    if (!confirm(`Bạn có chắc chắn muốn thanh toán số tiền ${totalAmount.toLocaleString('vi-VN')}đ không?`)) {
                        return;
                    }

                    try {
                        // Đổi trạng thái nút để tránh người dùng bấm liên tiếp (spam click)
                        confirmBtn.disabled = true;
                        confirmBtn.innerText = "Đang xử lý...";

                        // 4. Gọi API gửi lên Flask để tiến hành trừ tiền dữ liệu gốc
                        // 1. Gọi API (fetch) gửi lên Flask
                        const response = await fetch("http://127.0.0.1:5000/deduct-balance", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                id: user.id,
                                amount: totalAmount,
                                movie_name: checkoutData.title,       
                                quantity: checkoutData.ticketQty     
                            })
                        });

                        // 2. PHẢI CÓ DÒNG NÀY NGAY LẬP TỨC: Chuyển phản hồi thành JSON và gán vào biến 'data'
                        const data = await response.json(); 

                        // 3. Sau dòng này, bạn mới được phép sử dụng biến 'data' để check logic
                        if (data.success) {
                            alert(data.msg); // Khối này chạy an toàn vì 'data' đã có dữ liệu

                            user.balance = data.new_balance;
                            localStorage.setItem("currentUser", JSON.stringify(user));

                            if (typeof window.loadUserProfileAndBalance === "function") {
                                await window.loadUserProfileAndBalance();
                            }
                            if (typeof window.syncHeaderBalance === "function") {
                                window.syncHeaderBalance();
                            }
                            
                            // Gọi hàm load số dư ở thẻ ngân hàng bên dưới (nếu có)
                            if (typeof loadUserBalance === "function") {
                                await loadUserBalance();
                            }
                        } else {
                            alert(data.msg || "Thanh toán thất bại!");
                        }

                    } catch (error) {
                        console.error("Lỗi thanh toán:", error);
                        alert("Không thể kết nối đến máy chủ để thanh toán.");
                    } finally {
                        // Mở lại nút sau khi xử lý xong
                        confirmBtn.disabled = false;
                        confirmBtn.innerText = "Xác nhận thanh toán";
                    }
                });
            }

        });
        
        // Lấy nút xác nhận thanh toán
        // Đổi màu Payment Buttons
        document.querySelectorAll('.pay-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
            });
        });
    </script>
</body>
</html>
